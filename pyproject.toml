[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whichhook"
version = "0.1.0"
description = "For every git hook event, say what will actually run in this repository -- and name the hook files that never will."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["git", "hooks", "core.hooksPath", "husky", "pre-commit", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
whichhook = "whichhook.cli:main"

[project.urls]
Source = "https://github.com/committed-nightly/whichhook"

[tool.hatch.build.targets.wheel]
packages = ["src/whichhook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
